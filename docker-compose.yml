services:
  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=pgpassword
      - POSTGRES_DB=${POSTGRES_DB:-sample}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - db
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - "./api:/api"
    ports:
      - 5050:5050
    environment:
      - WAIT_DB=1
      - RUN_MIGRATIONS=1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:5050/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - db
      - apps
networks:
  db:
    name: db-network
  apps:
    name: apps-network
